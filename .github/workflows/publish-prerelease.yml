name: publish-prerelease
on:
  workflow_dispatch:
    inputs:
      debug_build:
        description: Enable debug build (uses internal-debug tag and pnpm build:debug)
        required: false
        default: false
        type: boolean
env:
  DO_NOT_TRACK: 1
  NEXT_TELEMETRY_DISABLED: 1
jobs:
  release:
    name: publish-prerelease-${{ github.ref_name }}-${{ github.sha }}
    permissions:
      id-token: write
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Setup
      uses: ./.github/actions/setup
    - name: Load npm token
      run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    - name: Determine release type and debug flag
      id: determine_release_type
      run: "if [[ \"${{ inputs.debug_build }}\" == \"true\" ]]; then\n  echo \"release_type=internal-debug\"\
        \ >> $GITHUB_OUTPUT\n  echo \"debug_flag=--debug\" >> $GITHUB_OUTPUT\nelif\
        \ [[ ${{ github.ref_name }} == \"main\" ]]; then\n  echo \"release_type=canary\"\
        \ >> $GITHUB_OUTPUT\n  echo \"debug_flag=\" >> $GITHUB_OUTPUT\nelse\n  echo\
        \ \"release_type=internal\" >> $GITHUB_OUTPUT\n  echo \"debug_flag=\" >> $GITHUB_OUTPUT\n\
        fi\n"
    - name: Release
      run: pnpm publish-prerelease --tag ${{ steps.determine_release_type.outputs.release_type
        }} ${{ steps.determine_release_type.outputs.debug_flag }}
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        NPM_CONFIG_PROVENANCE: true
